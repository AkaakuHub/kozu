<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#204a70" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>kozu</title>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: light-dark(#eef2f7, #111723);
      }
      #boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        color: light-dark(#175f56, #75dfc4);
        font:
          600 14px system-ui,
          sans-serif;
      }
      #root:not(:empty) ~ #boot {
        display: none;
      }
      .start-error {
        padding: 16px;
      }
      #boot i {
        width: 48px;
        height: 3px;
        border-radius: 2px;
        background: currentColor;
        animation: boot 900ms ease-in-out infinite alternate;
      }
      @keyframes boot {
        from {
          opacity: 0.28;
          transform: scaleX(0.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="kozuを読み込み中">
      <span aria-hidden="true">kozu</span>
      <i aria-hidden="true"></i>
    </div>
    <noscript>kozuを開くにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
